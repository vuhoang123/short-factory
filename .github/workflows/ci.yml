name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: shorts, POSTGRES_PASSWORD: ci-only-ephemeral-password, POSTGRES_DB: shorts_factory }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U shorts" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://shorts:ci-only-ephemeral-password@localhost:5432/shorts_factory?schema=public
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      ALLOW_REGISTRATION: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm db:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - name: Configure the render browser
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `REMOTION_BROWSER_EXECUTABLE=${chromium.executablePath()}\n`);
          NODE
      - run: pnpm test:browser
      - run: pnpm test:ui
      - run: pnpm smoke:phase6
        env:
          TEST_DATABASE_URL: postgresql://shorts:ci-only-ephemeral-password@localhost:5432/shorts_factory_test?schema=public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            docs/screenshots/
            test-results/
