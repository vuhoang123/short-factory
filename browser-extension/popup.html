<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Chụp bài về Shorts Factory</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>Chụp bài gốc</h1><p>Mở bài từ Studio trước, rồi bấm chụp tại đúng tab Facebook/Threads này.</p><p id="source" class="source"></p><label><input id="confirm" type="checkbox">Tôi đang xem đúng bài cần lấy; đã mở đầy đủ nội dung và bình luận.</label><button id="capture" disabled aria-describedby="status">Chụp và gửi về Studio</button><button id="cancel" hidden>Hủy lượt chụp</button><p id="status" role="status">Đang kiểm tra tab…</p><button id="recover" hidden>Mở Studio để kết nối</button><p class="help">Chỉ lấy nội dung đang được tải trong tab. Trình duyệt sẽ hiện thông báo gỡ lỗi trong lúc chụp. Không đọc cookie, mật khẩu hoặc các tab khác.</p></main><script type="module" src="popup.js"></script></body></html>
