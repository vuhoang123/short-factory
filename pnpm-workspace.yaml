packages:
  - apps/*
  - packages/*
  - workers/*
overrides:
  'effect@<3.20.0': '^3.20.0'
  'deepmerge-ts@<8.0.0': '^8.0.0'
  'multer@<2.5.0': '2.5.0'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@nestjs/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  msgpackr-extract: false
